# conda env create -f environment.yml    (run from the repository root)
# Conda provides Python and R (with Matrix, for the Tabula Muris export); the app and its Python dependencies are
# pip-installed.
name: gene_browser
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - r-base
  - r-matrix
  - pip
  - pip:
      - "-e .[dev]"
