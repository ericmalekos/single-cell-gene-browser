# conda env create -f environment.yml    (run from the repository root)
# Conda provides Python only; the app and its dependencies are pip-installed (fast to solve).
# Building the Tabula Muris store also needs R with the Matrix package (system R, or add r-base and r-matrix).
name: gene_browser
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - "-e .[dev]"
