#   immdict: /path/to/erv_immdict_deposit        # mouse Immune Dictionary + human Cytokine Dictionary deposit
#   perturbseq: /path/to/geiger_bmdc_deposit     # BMDC E3-ligase Perturb-seq deposit

tabula_muris:
